services:
  labelstudio:
    image: docker.io/ainyp/label-studio:latest
    container_name: labelstudio
    user: "0"
    network_mode: host
    volumes:
      - ./labelstudio_data:/label-studio/data
    environment:
      - ML_TIMEOUT_PREDICT=100

  grnddino:
    image: docker.io/brandonnyp/label-studio-ml-backend:grnddino-cpu
    container_name: grnddino
    network_mode: host
    volumes:
      - ./grnddino_data:/data
    environment:
      - MODEL_DIR=/data/models
      - WORKERS=1
      - THREADS=4
      - LOG_LEVEL=INFO
      - LABEL_STUDIO_HOST=http://localhost:8080
      - LABEL_STUDIO_ACCESS_TOKEN=3622bed48434c8cb364fe36e61e17e1e94ea3c62
      - BOX_THRESHOLD=0.30
      - TEXT_THRESHOLD=0.25
    depends_on:
      - labelstudio